name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'git+https://github.com/chichizhao912/eclip-reconstruct.git@0be3fcd324edfa6ba44fbf3caf560df22180f85a'
      - run: python -m pip install -e '.[test,motifs]'
      - run: python -c 'import eclip_reconstruct, pymemesuite'
      - run: python -m pytest -q

